{% extends 'store/base.html' %}
{% load static %}

{% block title %}My Cart{% endblock %}

{% block extra_css %}
    <style>
      /* Adaptations for the Django-wired controls that replace Suha's static demo markup
         (Suha styles `a.remove-product` and a text `input.qty-text`; we use a button and a select). */
      .cart-table table button.remove-product {
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        display: inline-block;
        border-radius: 50%;
        background-color: #ea4c62;
        color: #ffffff;
        font-size: 12px;
        line-height: 1;
        text-align: center;
        cursor: pointer;
      }
      .cart-table table button.remove-product:hover,
      .cart-table table button.remove-product:focus {
        background-color: #020310;
        color: #ffffff;
      }
      .cart-table .qty-text {
        width: 3.75rem;
        padding: 0 0.25rem;
        color: #020310;
        font-weight: 600;
      }
      .cart-table table a span.cart-product-title {
        color: inherit;
      }
      .cart-item-total {
        margin-top: 0.25rem;
        color: #747794;
        font-size: 12px;
        font-weight: 600;
      }
    </style>
{% endblock %}

{% block content %}
    <!-- Header Area-->
    <div class="header-area" id="headerArea">
      <div class="container h-100 d-flex align-items-center justify-content-between rtl-flex-d-row-r">
        <!-- Back Button-->
        <div class="back-button me-2"><a href="{% url 'store' %}"><i class="fa-solid fa-arrow-left-long"></i></a></div>
        <!-- Page Title-->
        <div class="page-heading">
          <h6 class="mb-0">My Cart</h6>
        </div>
        <!-- Navbar Toggler: base.html ships no offcanvas sidenav, so this only keeps the title centred-->
        <div class="suha-navbar-toggler ms-2 invisible" aria-hidden="true">
          <div><span></span><span></span><span></span></div>
        </div>
      </div>
    </div>

    <!-- Cart Page (driven by the Alpine `cart` component registered in static/js/cart.js,
         which is instantiated once on <body> in store/base.html)-->
    <div class="page-content-wrapper">
      <div class="container">
        <!-- Cart Wrapper-->
        <div class="cart-wrapper-area py-3">
          <!-- Cart Table-->
          <div class="cart-table card mb-3" x-show="items.length > 0" x-cloak>
            <div class="table-responsive card-body">
              <table class="table mb-0">
                <tbody>
                  <template x-for="item in items" :key="item.id">
                    <tr>
                      <!-- Remove product-->
                      <th scope="row">
                        <button
                          class="remove-product"
                          type="button"
                          @click="deleteItem(item.id)"
                          :aria-label="'Remove ' + item.product.title"
                        ><i class="fa-solid fa-xmark"></i></button>
                      </th>
                      <!-- Product image-->
                      <td><img class="rounded" :src="item.product.image || '{% static 'img/product/11.png' %}'" :alt="item.product.title"></td>
                      <!-- Product title + unit price-->
                      <td>
                        <a :href="item.product.url">
                          <span class="cart-product-title" x-text="item.product.title"></span>
                          <span x-text="'$' + item.price + ' × ' + item.qyt"></span>
                          <span x-show="item.size || item.color" x-text="[item.size, item.color].filter(Boolean).join(' / ')"></span>
                        </a>
                      </td>
                      <!-- Quantity + line total-->
                      <td>
                        <div class="quantity">
                          <select
                            class="qty-text"
                            x-model.number="item.qyt"
                            @change="updateQuantity(item)"
                            :aria-label="'Quantity of ' + item.product.title"
                          >
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                          </select>
                        </div>
                        <div class="cart-item-total" x-text="'$' + item.total"></div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Empty Cart-->
          <div class="card mb-3" x-show="items.length === 0" x-cloak>
            <div class="card-body text-center py-5">
              <i class="fa-solid fa-bag-shopping display-6 d-block mb-3 text-muted"></i>
              <h6 class="mb-1">Your basket is empty</h6>
              <p class="mb-3 text-muted">Add a product to your basket and it will show up here.</p>
              <a class="btn btn-primary btn-sm" href="{% url 'store' %}">Continue Shopping</a>
            </div>
          </div>

          <!-- Cart Amount Area-->
          <div class="card cart-amount-area" x-cloak>
            <div class="card-body d-flex align-items-center justify-content-between">
              <h5 class="total-price mb-0">$<span x-text="total"></span></h5>
              <a class="btn btn-warning" href="{% url 'checkout' %}">Checkout Now</a>
            </div>
          </div>
        </div>
      </div>
    </div>
{% endblock %}
